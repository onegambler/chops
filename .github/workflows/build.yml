name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-app:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project Chops.xcodeproj \
            -scheme Chops \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -resolvePackageDependencies

      - name: Build Chops
        run: |
          set -o pipefail
          xcodebuild \
            -project Chops.xcodeproj \
            -scheme Chops \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Chops.xcodeproj \
            -scheme ChopsTests \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug/Chops.app \
            build/Chops-Debug-unsigned.zip

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Chops-Debug-unsigned
          path: build/Chops-Debug-unsigned.zip
          retention-days: 7

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
